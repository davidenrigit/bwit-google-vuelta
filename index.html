<!doctype html>
<!--
  Página puente de la conexión con Google Calendar (09-10-2026).

  Google solo devuelve a la persona, después de dar permiso, a una
  dirección https con dominio o a localhost. Al portal se entra por
  http://192.168.1.169:4000, http://vm-portal:4000 o la IP de Tailscale, y
  ninguna vale; por eso David tuvo que conectar con un túnel. Esta página
  vive en GitHub Pages (https://davidenrigit.github.io/bwit-google-vuelta/),
  que sí vale, y lo único que hace es mandar a cada uno de vuelta a SU
  portal con lo que trae Google.

  - El portal pone su dirección delante del `state`: «<origen en base64url>.<resto>».
  - Aquí solo se deja volver a las direcciones exactas del portal (las tres
    de la VM, en el puerto 4000) o a este mismo equipo: a ninguna otra.
  - No guarda nada ni habla con nadie. El código que trae Google no sirve
    sin el secreto del cliente, que solo tiene la VM, y la VM comprueba la
    firma del `state` antes de canjearlo.

  La fuente de verdad es este fichero, en el repo del portal
  (docs/google-vuelta/index.html); el de GitHub Pages es una copia.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Bwit Manager · volviendo al portal</title>
<style>
  :root{color-scheme:light dark;--fondo:#f5f7fa;--texto:#1d2433;--enlace:#004C97}
  @media (prefers-color-scheme:dark){:root{--fondo:#111722;--texto:#e7ecf3;--enlace:#7fb2e8}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--fondo);color:var(--texto);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
  main{max-width:440px;padding:24px 16px;text-align:center}
</style>
</head>
<body>
<main><p id="mensaje">Volviendo a Bwit Manager…</p></main>
<script>
(function () {
  // Solo las direcciones del portal de la VM (oficina, nombre y Tailscale, puerto 4000) y este mismo
  // equipo. Nada de rangos ni de nombres sueltos: esta página no comprueba la firma, y con toda la red
  // local valiendo, cualquier equipo de la oficina se podía quedar el código de Google de otra persona
  // (revisión de seguridad del 10-10-2026). La misma expresión que Servicios/VueltaGoogle.js.
  var PERMITIDO = /^(https?:\/\/(localhost|127\.0\.0\.1|\[::1\])(:\d{1,5})?|https?:\/\/(192\.168\.1\.169|vm-portal|100\.71\.153\.25):4000)$/i;
  var mensaje = document.getElementById('mensaje');
  function decir(texto) { mensaje.textContent = texto; }
  try {
    var state = new URLSearchParams(location.search).get('state') || '';
    var b = state.split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    var origen = atob(b);
    if (!PERMITIDO.test(origen)) {
      decir('Esta vuelta no lleva a ningún Bwit Manager conocido. Vuelve al portal y pulsa otra vez «Conectar mi Google Calendar».');
      return;
    }
    location.replace(origen + '/api/google/vuelta' + location.search);
  } catch (e) {
    decir('No se ha podido volver al portal. Vuelve a él y pulsa otra vez «Conectar mi Google Calendar».');
  }
})();
</script>
</body>
</html>
